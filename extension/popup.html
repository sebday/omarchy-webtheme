<!doctype html>
<html class="popup" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omarchy Webtheme</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Webtheme</h1>
        <p id="meta">Loading…</p>
      </div>
      <label class="toggle">
        <input id="global" type="checkbox" />
        <span>On</span>
      </label>
    </header>

    <section id="current" class="card" hidden>
      <p id="current-host"></p>
      <p id="current-status"></p>
      <button id="theme-site" type="button" hidden>Theme this site</button>
    </section>

    <p id="notice" class="notice" hidden></p>

    <p id="error" class="error" hidden></p>

    <footer>
      <a id="all-sites" href="sites.html">All sites</a>
    </footer>

    <script src="ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
